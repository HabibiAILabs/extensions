name: Validate extensions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: HabibiAILabs/habibi
          path: habibi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: habibi
      - run: cargo build --manifest-path habibi/Cargo.toml
      - name: Validate chat
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir chat
      - name: Validate memory
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir memory
      - name: Validate essentials
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir essentials
      - name: Validate git
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir git
      - name: Validate Habibi documentation
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir habibi-docs
      - name: Validate Soul
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir soul
      - name: Validate web search
        run: HABIBI_EXTENSIONS_DIR="$RUNNER_TEMP/extensions" habibi/target/debug/habibi install . --subdir web-search
